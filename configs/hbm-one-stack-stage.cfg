# Stage replay exploration: one HBM stack (48 GiB) + one HBF stack.
# Derived from upstream server-hbm128-hbf512.cfg; capacity/stacks changed explicitly.
# Product timing assumptions, not hardware calibration or a 4000 Ada prediction.
# Native request adapter currently requires refresh/replication disabled.
hbm-capacity-bytes=51539607552
hbm-stacks=1
hbm-channels=32
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=16
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=8
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
hbm-refresh=false
hbm-same-bank-refresh=false
hbm-trefi-ns=3900
hbm-trfc-ns=350
hbm-trfcsb-ns=160
hbm-trrefd-ns=10
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8
hbm-standard=JEDEC-JESD270-4-2025-04
hbm-replicate-symmetric-pseudo-channels=false
