# Stage replay exploration: one HBM stack (48 GiB) + one HBF stack.
# Derived from upstream server-hbm128-hbf512.cfg; capacity/stacks changed explicitly.
# Product timing assumptions, not hardware calibration or a 4000 Ada prediction.
# OCP HBF v0.7.0 grade 2 + JEDEC HBM4 public-organization baseline.
# NAND, ECC, HBM absolute timings, host DRAM and thermal RC values are
# explicit product/controller assumptions; see parameter-provenance.json.

hbm-capacity-bytes=51539607552
hbf-capacity-ratio=4
base-die-link-read-bw=1024
base-die-link-write-bw=1024
base-die-link-latency-ns=20
hbm-stacks=1
hbm-channels=32
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=16
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=8
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
hbm-refresh=true
hbm-same-bank-refresh=true
hbm-trefi-ns=3900
hbm-trfc-ns=350
hbm-trfcsb-ns=160
hbm-trrefd-ns=10
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8
hbf-processor-interconnect=ucie
hbf-stacks=1
hbf-channels=16
hbf-dies-per-channel=1
hbf-planes-per-die=16
hbf-pages-per-block=256
hbf-page-size=4096
hbf-oob-bytes=224
hbf-media-lanes-per-plane=1
hbf-page-buffer-banks-per-plane=2
hbf-read-ns=4000
hbf-program-ns=75000
hbf-erase-ns=2000000
hbf-ecc-decode-latency-ns=500
hbf-ecc-encode-latency-ns=500
hbf-ecc-decode-raw-bw=101.25
hbf-ecc-encode-raw-bw=101.25
hbf-channel-bw=101.25
hbf-tsv-bw=1644
hbf-media-lane-bw=2048
hbf-page-buffer-bw=2048
hbf-gc-low-watermark-pages=4096
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-gc-wear-leveling-weight=0.05
hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=false
hbf-write-buffer-pages=1024
hbf-write-buffer-flush-threshold-pages=512
hbf-standard=OCP-HBF-0.7.0-2026-08-03
hbm-standard=JEDEC-JESD270-4-2025-04
hbf-speed-grade=2
